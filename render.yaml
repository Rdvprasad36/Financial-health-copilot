services:
  - type: web
    name: financial-health-copilot-api
    runtime: node
    buildCommand: pnpm install --frozen-lockfile && pnpm build:api
    startCommand: pnpm start:api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false